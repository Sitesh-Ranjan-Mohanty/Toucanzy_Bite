<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6fb" />
    <meta name="description" content="Discover delicious, crunchy freeze-dried fruit from Toucanzy Bite. Real fruit, no fuss, delivered to your door." />
    <title>Toucanzy Bite — Fruit, with a little crunch</title>
    <link rel="icon" type="image/png" href="/Toucanzy_Bite_Logo_Transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="page-loader" class="page-loader" role="status" aria-label="Loading Toucanzy Bite">
      <div class="page-loader-content">
        <div class="loader-spinner">
          <img src="/images/loading-fruit.png" alt="" />
        </div>
        <p>Getting your fruit ready</p>
        <span>Real fruit. Wild crunch.</span>
      </div>
    </div>
    <script>
      const fruitNumber = Math.floor(Math.random() * 16) + 1;
      document.querySelector(".loader-spinner img").src =
        `/images/loader-fruit-${String(fruitNumber).padStart(2, "0")}.webp`;
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
